name: DevOpsNotes Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kamouloxpelvis/blog-devopsnotes

jobs:

  # =========================================================
  # BUILD & PUSH
  # =========================================================

  build:
    name: Build & Push Docker images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------------
      # Backend
      # -------------------------------------------------------

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      # -------------------------------------------------------
      # Frontend
      # -------------------------------------------------------

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  # =========================================================
  # DEPLOY K3S
  # =========================================================

  deploy_to_k3s:
      needs: build
      runs-on: self-hosted

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Deploy to K3s
          run: |
            set -e

            echo "🚀 Deploying DevOpsNotes with SHA: ${{ github.sha }}"

            kubectl apply -f k8s/ -n blog-prod

            kubectl set image deployment/blog-devopsnotes-deployment \
              blog-backend=ghcr.io/kamouloxpelvis/blog-devopsnotes-backend:${{ github.sha }} \
              blog-frontend=ghcr.io/kamouloxpelvis/blog-devopsnotes-frontend:${{ github.sha }} \
              -n blog-prod

            kubectl rollout status \
              deployment/blog-devopsnotes-deployment \
              -n blog-prod \
              --timeout=300s

            echo "✅ DevOpsNotes deployment successful"