name: DevOpsNotes Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kamouloxpelvis/blog-devopsnotes

jobs:

  build:
    name: Build & Push Docker images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # Backend
      # ---------------------------------------------------------

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      # ---------------------------------------------------------
      # Frontend
      # ---------------------------------------------------------

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

  deploy:
    name: Deploy to K3s
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.K3S_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.K3S_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_USER: ${{ secrets.K3S_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh "${K3S_USER}@${K3S_HOST}" << EOF

            set -e

            echo "🚀 Deploying DevOpsNotes ${IMAGE_TAG}"

            kubectl -n blog-prod set image deployment/blog-devopsnotes-deployment \
              blog-backend=ghcr.io/kamouloxpelvis/devopsnotes-backend:${IMAGE_TAG} \
              blog-frontend=ghcr.io/kamouloxpelvis/devopsnotes-frontend:${IMAGE_TAG}

            kubectl -n blog-prod rollout status \
              deployment/blog-devopsnotes-deployment \
              --timeout=300s

            echo "✅ DevOpsNotes deployment successful"

          EOF